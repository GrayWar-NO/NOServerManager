syntax = "proto3";

package com.graywar.noServerManager.proto;



option java_multiple_files = true;
option java_package = "com.graywar.noServerManager.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------------
// Messages
// ---------------------------------------------------------------------

message StatusRequest {
  google.protobuf.Timestamp last_heartbeat = 3;
}

message StatusResponse {
  bool ok = 1;
}


message BanRequest {
  bool shouldBeBanned = 1;
  uint64 steamID = 2;
  string reason = 3;
  google.protobuf.Timestamp ban_start = 4;
  google.protobuf.Timestamp ban_end = 5;
}

message ChatLog{
  google.protobuf.Timestamp messageSendTime = 1;
  string messageChannel = 2;
  string message = 3;
}

message KickLog{
  uint64 steamID = 1;
  string reason = 2;
  google.protobuf.Timestamp time = 3;
}

message WarnLog{
  uint64 steamID = 1;
  string reason = 2;
  google.protobuf.Timestamp time = 3;
}

message JoinLeaveLog{
  uint64 steamID = 1;
  bool isOn = 2;
  google.protobuf.Timestamp time = 3;
}

message missionStatus{
  string missionName = 1;
  google.protobuf.Timestamp time = 2;
}

message KillLog{
  uint64 killer = 1;
  uint64 killed = 2;
  string weapon = 3;
  google.protobuf.Timestamp time = 4;
}

message Ack {
  bool ok = 1;
}



// ---------------------------------------------------------------------
// Services
// ---------------------------------------------------------------------

service EdgeAgentService {
  // The edge agent calls this to report its status.
  rpc ReportStatus(StatusRequest) returns (StatusResponse);
  rpc SendBan(BanRequest) returns (Ack);
  rpc SendKick(KickLog) returns (Ack); // TODO
  rpc SendWarn(WarnLog) returns (Ack); // TODO
  rpc SendPlayerActivity(JoinLeaveLog) returns (Ack); // TODO
  rpc SendMissionChange(missionStatus) returns (Ack); // TODO
  rpc SendKill(KillLog) returns (Ack); // TODO
  rpc SentTeamKill(KillLog) returns (Ack); // TODO

  rpc SendChatLogsStream(stream ChatLog) returns (Ack);
  rpc SubscribeToBans(google.protobuf.Empty) returns (stream BanRequest);
}
